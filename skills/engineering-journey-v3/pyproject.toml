[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "engineering-journey-v3"
version = "0.2.0"
description = "Deterministic CLI and agent-agnostic skill for Engineering Journey v3"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fulcra" }]
dependencies = ["fulcra-api==0.1.40"]

[project.scripts]
engineering-journey = "engineering_journey_v3.cli:main"

[dependency-groups]
dev = [
  "mypy==1.17.1",
  "pytest==7.4.4",
  "ruff==0.12.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engineering_journey_v3"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "engineering_journey_v3/SKILL.md"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
